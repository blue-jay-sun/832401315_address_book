<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾联 · 通讯录</title><link rel="stylesheet" href="/style.css"><body><aside><div class="brand">拾联<span>CONTACTS</span></div><p>把重要的人，放在手边。</p><button id="all">▦ 全部联系人</button><button id="favorites">☆ 我的收藏</button><small>本地存储 · 随时相联</small></aside><main><header><div><label>YOUR PERSONAL NETWORK</label><h1>我的通讯录</h1><p>记录每一种联系方式，珍藏每一份连接。</p></div><button id="add" class="primary">＋ 新建联系人</button></header><section class="toolbar"><input id="search" placeholder="搜索姓名、电话、邮箱…" aria-label="搜索联系人"><button id="import">导入 Excel</button><a href="/api/export">↓ 导出 Excel</a><input type="file" id="file" accept=".xlsx" hidden></section><p id="summary"></p><section id="cards"></section><p id="notice" role="status"></p><footer>拾联 ADDRESS BOOK / 软件工程 · 结对编程实践</footer></main><dialog id="editor"><form id="form"><h2 id="title">新建联系人</h2><input name="id" hidden><label>姓名 *<input name="name" required maxlength="100"></label><div class="fields"><label>电话号码<textarea name="phones" placeholder="每行一个电话号码"></textarea></label><label>电子邮箱<textarea name="emails" placeholder="每行一个邮箱"></textarea></label><label>社交账号<textarea name="social" placeholder="例如 微信：xxx"></textarea></label><label>联系地址<textarea name="addresses" placeholder="每行一个地址"></textarea></label></div><label>备注<textarea name="notes"></textarea></label><label class="check"><input type="checkbox" name="favorite"> 加入收藏</label><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">保存联系人</button></div></form></dialog><script src="/app.js"></script></body></html>
